[package]
name = "exeify"
version = "0.3.0"
edition = "2021"
description = "把网址或本地 HTML 项目一键打包成 Windows exe（零工具链、秒级出包）"
license = "Apache-2.0"
repository = "https://github.com/44886/Exeify"

[[bin]]
name = "exeify"
path = "src/main.rs"

[dependencies]
wry = "0.56"
tao = "0.34"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = "0.15"
mime_guess = "2"
anyhow = "1"
# 运行时改产物 exe 图标（不启用 images 特性，避免拉入重量级 image crate）
editpe = { version = "0.2", default-features = false, features = ["std"] }
# 把用户的 PNG 转成 ICO（.ico 直接用）
ico = "0.3"
# 自己解码 PNG（支持索引/灰度/RGB/RGBA 全类型），已是 ico 的传递依赖
png = "0.17"
# 自更新的 HTTPS 客户端：纯 Rust rustls TLS（不依赖系统 OpenSSL），特性精简。
# JSON 复用项目已有的 serde_json 解析，不启用 ureq 的 json 特性。
ureq = { version = "3", default-features = false, features = ["rustls"] }

[build-dependencies]
# 把 exeify.exe 自身的图标编进 PE
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
