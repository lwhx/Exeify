<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exeify</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 左侧分类菜单 -->
    <nav class="side">
      <div class="side-brand">
        <svg class="logo" width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.6"/>
          <path d="M3 8h18" stroke="currentColor" stroke-width="1.6"/>
          <path d="M8.5 12.5 10.5 14.5 8.5 16.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M13 16.5h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <span class="side-title">Exeify</span>
      </div>

      <div class="side-menu">
        <button class="nav-item is-active" data-target="sec-source">
          <svg class="nav-ico" width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6Z" stroke="currentColor" stroke-width="1.6"/></svg>
          <span>内容来源</span>
        </button>
        <button class="nav-item" data-target="sec-window">
          <svg class="nav-ico" width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3 8h18" stroke="currentColor" stroke-width="1.6"/></svg>
          <span>窗口设置</span>
        </button>
        <button class="nav-item" data-target="sec-appearance">
          <svg class="nav-ico" width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="3" stroke="currentColor" stroke-width="1.6"/><path d="M8 14l2.5-3 2 2.5L15 10l3 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="9" r="1.2" fill="currentColor"/></svg>
          <span>外观</span>
        </button>
        <button class="nav-item" data-target="sec-protect">
          <svg class="nav-ico" width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v5c0 4.4-3 8.3-7 10-4-1.7-7-5.6-7-10V6l7-3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9.2 12l2 2 3.6-3.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>源码保护</span>
        </button>
        <button class="nav-item" data-target="sec-output">
          <svg class="nav-ico" width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 4v10m0 0 4-4m-4 4-4-4M5 18h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>输出</span>
        </button>
      </div>

      <div class="side-foot">
        <button class="about-link" id="openAbout" title="关于">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M12 11v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="7.6" r="1.1" fill="currentColor"/></svg>
          关于
        </button>
      </div>
    </nav>

    <!-- 右侧内容（唯一滚动容器） -->
    <main class="content" id="content">
      <!-- 内容来源 -->
      <section class="sec" id="sec-source">
        <div class="sec-head">
          <svg class="sec-ico" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6Z" stroke="currentColor" stroke-width="1.6"/></svg>
          <h2>内容来源</h2>
        </div>
        <div class="tabs" role="tablist">
          <button class="tab is-active" data-mode="local" role="tab">本地网页目录</button>
          <button class="tab" data-mode="url" role="tab">在线网址</button>
        </div>

        <div class="panel" data-panel="local">
          <label class="field">
            <span class="label">网页目录</span>
            <div class="row">
              <input id="folder" type="text" readonly placeholder="选择包含 index.html 的文件夹" />
              <button class="btn ghost" id="pickFolder">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6Z" stroke="currentColor" stroke-width="1.6"/></svg>
                选择
              </button>
            </div>
          </label>
          <label class="field">
            <span class="label">入口文件（选目录后自动识别）</span>
            <select id="entry" disabled>
              <option value="">请先选择网页目录</option>
            </select>
          </label>
        </div>

        <div class="panel hidden" data-panel="url">
          <label class="field">
            <span class="label">网址</span>
            <input id="url" type="text" placeholder="https://example.com" />
          </label>
        </div>
      </section>

      <!-- 窗口设置 -->
      <section class="sec" id="sec-window">
        <div class="sec-head">
          <svg class="sec-ico" width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3 8h18" stroke="currentColor" stroke-width="1.6"/></svg>
          <h2>窗口设置</h2>
        </div>
        <label class="field">
          <span class="label">窗口标题</span>
          <input id="title" type="text" value="My App" />
        </label>
        <div class="grid">
          <label class="field">
            <span class="label">启动状态</span>
            <select id="state">
              <option value="normal" selected>普通窗口</option>
              <option value="maximized">最大化</option>
              <option value="fullscreen">全屏无边框</option>
            </select>
          </label>
          <label class="field small">
            <span class="label">宽</span>
            <input id="width" type="number" value="1024" min="200" />
          </label>
          <label class="field small">
            <span class="label">高</span>
            <input id="height" type="number" value="720" min="200" />
          </label>
        </div>
        <label class="check">
          <input id="resizable" type="checkbox" checked />
          <span>允许调整窗口大小</span>
        </label>
      </section>

      <!-- 外观 -->
      <section class="sec" id="sec-appearance">
        <div class="sec-head">
          <svg class="sec-ico" width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="3" stroke="currentColor" stroke-width="1.6"/><path d="M8 14l2.5-3 2 2.5L15 10l3 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="9" r="1.2" fill="currentColor"/></svg>
          <h2>外观</h2>
        </div>

        <label class="field">
          <span class="label">程序图标（可选，.ico / .png）</span>
          <div class="row icon-row">
            <span class="icon-preview" id="iconPreview" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="3" stroke="currentColor" stroke-width="1.6"/><path d="M8 14l2.5-3 2 2.5L15 10l3 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="9" r="1.2" fill="currentColor"/></svg>
            </span>
            <input id="icon" type="text" readonly placeholder="不选则使用默认图标" />
            <button class="btn ghost" id="pickIcon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6Z" stroke="currentColor" stroke-width="1.6"/></svg>
              选择
            </button>
            <button class="btn ghost icon-clear hidden" id="clearIcon" title="清除">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            </button>
          </div>
        </label>

        <label class="field">
          <span class="label">启动页图片（可选，.png / .jpg，消除白屏）</span>
          <div class="row icon-row">
            <span class="icon-preview" id="splashPreview" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3 16l5-5 4 4 3-3 6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="9" r="1.2" fill="currentColor"/></svg>
            </span>
            <input id="splash" type="text" readonly placeholder="不选则不显示启动页" />
            <button class="btn ghost" id="pickSplash">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6Z" stroke="currentColor" stroke-width="1.6"/></svg>
              选择
            </button>
            <button class="btn ghost icon-clear hidden" id="clearSplash" title="清除">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            </button>
          </div>
        </label>

        <div class="grid two">
          <label class="field small">
            <span class="label">启动页最少显示(秒)</span>
            <input id="splashSec" type="number" value="1.5" min="0" step="0.1" />
          </label>
          <label class="field">
            <span class="label">启动页背景色</span>
            <div class="row color-row">
              <input id="splashBg" type="color" value="#0f172a" />
              <input id="splashBgHex" type="text" value="#0f172a" spellcheck="false" />
            </div>
          </label>
        </div>
      </section>

      <!-- 源码保护 -->
      <section class="sec" id="sec-protect">
        <div class="sec-head">
          <svg class="sec-ico" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v5c0 4.4-3 8.3-7 10-4-1.7-7-5.6-7-10V6l7-3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9.2 12l2 2 3.6-3.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <h2>源码保护</h2>
        </div>
        <label class="check protect-check">
          <input id="protect" type="checkbox" checked />
          <span>加密源码，防止直接解压 + 禁用查看源码（F12 / 右键）</span>
        </label>
        <p class="protect-note">提高门槛，非绝对安全。</p>
      </section>

      <!-- 输出 -->
      <section class="sec" id="sec-output">
        <div class="sec-head">
          <svg class="sec-ico" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 4v10m0 0 4-4m-4 4-4-4M5 18h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <h2>输出</h2>
        </div>
        <label class="field">
          <span class="label">输出 exe</span>
          <div class="row">
            <input id="output" type="text" readonly placeholder="选择保存位置，例如 app.exe" />
            <button class="btn ghost" id="pickOutput">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 4v10m0 0 4-4m-4 4-4-4M5 18h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              选择
            </button>
          </div>
        </label>

        <button class="btn primary" id="pack">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M21 8 12 3 3 8m18 0-9 5m9-5v8l-9 5m0-8L3 8m9 5v8M3 8v8l9 5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          开始打包
        </button>

        <div class="status" id="status" aria-live="polite"></div>
      </section>
    </main>
  </div>

  <div class="overlay hidden" id="aboutOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
      <button class="modal-close" id="closeAbout" title="关闭">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <h2 id="aboutTitle">关于 Exeify</h2>
      <p class="about-desc">把网址或本地网页，一键打包成可运行的 exe。<br/>轻量、秒级出包、零工具链。</p>

      <div class="update-box">
        <div class="update-row">
          <span class="update-version" id="updVersion">当前版本 v…</span>
          <button class="btn ghost update-check" id="checkUpdate">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M20 4v4h-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            检查更新
          </button>
        </div>
        <div class="update-status" id="updStatus" aria-live="polite"></div>
        <button class="btn primary update-apply hidden" id="doUpdate">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4v10m0 0 4-4m-4 4-4-4M5 18h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          立即更新
        </button>
      </div>
      <div class="qr">
        <img src="qrcode.jpg" alt="不坑老师 微信公众号二维码" width="180" height="180" />
        <div class="qr-cap">
          <strong>不坑老师</strong>
          <span>微信扫码关注公众号</span>
        </div>
      </div>
      <div class="about-foot">
        <span>开源地址（Apache-2.0）</span>
        <a href="https://github.com/44886/Exeify" class="repo-link" id="repoLink">github.com/44886/Exeify</a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
