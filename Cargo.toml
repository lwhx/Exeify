[package]
name = "html2exe"
version = "0.1.0"
edition = "2021"
description = "把网址或本地 HTML 项目一键打包成 Windows exe（零工具链、秒级出包）"
license = "Apache-2.0"
repository = "https://github.com/44886/html2exe"

[[bin]]
name = "html2exe"
path = "src/main.rs"

[dependencies]
wry = "0.56"
tao = "0.34"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = "0.15"
mime_guess = "2"
anyhow = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
